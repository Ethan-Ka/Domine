<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domine</title>
<meta name="description" content="Turn two or more Bluetooth speakers into one sound system for your Mac. Split audio left and right across two speakers, or surround with four.">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  --bg:#F2F0EC; --bg2:#EAE7E1; --ink:#1E1D1B; --muted:#57524D; --rule:#CFC9BF;
  --btn:#C73A29; --btn-hover:#B83221; --btn-active:#A52B1D; --btn-ink:#fff; --focus:#1E1D1B;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1E1D1B; --bg2:#242220; --ink:#EEEBE5; --muted:#A8A29A; --rule:#3B3835; --focus:#EEEBE5}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; display:flex; flex-direction:column;
  background:linear-gradient(180deg,var(--bg) 0,var(--bg) 55%,var(--bg2) 100%);
  color:var(--ink); font:400 clamp(1rem,.95rem + .25vw,1.25rem)/1.55 var(--font);
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%; max-width:72rem; margin:0 auto; padding:0 clamp(1rem,5vw,3rem)}
main{flex:1; display:flex; flex-direction:column; justify-content:center; padding:clamp(2rem,8vh,6rem) 0}
.art{display:block; width:100%; max-width:56rem; margin:0 auto; overflow:hidden}
.art img{display:block; width:110%; max-width:none; height:auto; margin-left:-7.86%}
.body{
  display:flex; flex-direction:column; align-items:center; text-align:center;
  margin:clamp(1.25rem,3vw,2rem) auto 0; max-width:56rem;
}
.claim{
  margin:0 auto; max-width:20ch; font-size:clamp(1.5rem,1rem + 2.2vw,2.75rem);
  line-height:1.15; letter-spacing:-.022em; font-weight:600; text-wrap:balance;
}
.actions{display:flex; flex-wrap:wrap; justify-content:center; gap:.75rem; width:100%}
.btn{
  display:inline-block; padding:.8em 1.35em; border-radius:.55rem; border:1px solid var(--btn);
  background:var(--btn); color:var(--btn-ink); font-weight:600; font-size:1.0625rem; line-height:1.55;
  letter-spacing:-.005em; text-decoration:none; text-align:center; transition:background-color .12s ease, transform .12s ease;
}
.btn:hover{background:var(--btn-hover)}
.btn:active{background:var(--btn-active); transform:translateY(1px)}
.btn.alt{background:transparent; color:var(--ink); border-color:var(--rule)}
.btn.alt:hover{background:var(--bg2); border-color:var(--muted)}
.btn.alt:active{background:var(--rule)}
a:focus-visible{outline:3px solid var(--focus); outline-offset:3px; border-radius:.35rem}
.pitch{margin-top:1.25rem}
.sub{margin:.75rem auto 0; max-width:38ch; color:var(--muted)}
.note{margin:.6rem 0 0; color:var(--muted); font-size:.9rem}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.credit{padding:1rem clamp(1rem,5vw,3rem) 1.25rem; font-size:.9rem}
.credit a{color:var(--muted); text-decoration:none}
.credit a:hover{color:var(--ink); text-decoration:underline; text-underline-offset:.25em}
@media (max-width:30rem){.actions{flex-direction:column}.btn{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="wrap">
    <h1 class="sr">Domine</h1>
    <picture class="art">
      <source srcset="header-dark.svg" media="(prefers-color-scheme: dark)">
      <img src="header-light.svg" width="840" height="200" alt="Domine, with the left channel in off-white and the right channel in red">
    </picture>
    <div class="body">
      <div class="actions">
        <a class="btn" href="https://github.com/Ethan-Ka/Domine/releases/latest">Download for macOS</a>
        <a class="btn alt" href="https://github.com/Ethan-Ka/Domine">View on GitHub</a>
      </div>
      <p class="note">macOS 14.4 or later</p>
      <div class="pitch">
        <p class="claim">Two+ Bluetooth speakers, one sound system.</p>
        <p class="sub">Split your Mac's audio left and right across two speakers, or surround with four. They stay in sync, and your volume keys control them all.</p>
      </div>
    </div>
  </div>
</main>
<footer class="credit"><a href="https://ethankawley.com/">Ethan Kawley</a></footer>
</body>
</html>
