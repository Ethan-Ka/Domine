name: Domine
options:
  bundleIdPrefix: com.ethankawley
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: XF5RVRJ6VU
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: c11

targets:
  Domine:
    type: application
    platform: macOS
    sources:
      - Sources/Domine
    dependencies:
      - target: DomineDSP
    # Hardened runtime blocks the microphone without this (auto-calibration).
    entitlements:
      path: Sources/Domine/Domine.entitlements
      properties:
        com.apple.security.device.audio-input: true
    info:
      path: Sources/Domine/Info.plist
      properties:
        CFBundleDisplayName: Domine
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.music
        NSMicrophoneUsageDescription: Domine listens to its own test sounds through the built-in microphone to line up the two speakers.
        NSAudioCaptureUsageDescription: Domine captures system audio to send the left channel to one speaker and the right channel to another.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethankawley.Domine
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Domine/Info.plist
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/DomineDSP

  DomineDSP:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/DomineDSP
        excludes:
          - module.modulemap
    settings:
      base:
        GCC_WARN_PEDANTIC: YES
        CLANG_WARN_DOCUMENTATION_COMMENTS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES

  DomineDriver:
    type: bundle
    platform: macOS
    sources:
      - path: Sources/DomineDriver
        excludes:
          - module.modulemap
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
    info:
      path: Sources/DomineDriver/Info.plist
      properties:
        CFBundleName: Domine
        CFBundleDisplayName: Domine
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        CFPlugInDynamicRegistration: false
        CFPlugInUnloadFunction: ""
        CFPlugInFactories:
          8E6560DA-E2C1-469A-B453-54199794D373: DomineDriver_Create
        CFPlugInTypes:
          443ABAB8-E7B3-491A-B985-BEB9187030DB:
            - 8E6560DA-E2C1-469A-B453-54199794D373
    settings:
      base:
        PRODUCT_NAME: Domine
        PRODUCT_BUNDLE_IDENTIFIER: com.ethankawley.Domine.driver
        WRAPPER_EXTENSION: driver
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/DomineDriver/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        GCC_WARN_PEDANTIC: YES
        CLANG_WARN_DOCUMENTATION_COMMENTS: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES

  DomineDriverTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DomineDriverTests
      - path: Sources/DomineDriver/DriverMath.c
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ethankawley.DomineDriverTests
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/DomineDriver

  DomineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DomineTests
    dependencies:
      - target: Domine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ethankawley.DomineTests
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/DomineDSP

  DomineDSPTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/DomineDSPTests
    dependencies:
      - target: DomineDSP
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ethankawley.DomineDSPTests
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/DomineDSP

schemes:
  Domine:
    build:
      targets:
        Domine: all
        DomineTests: [test]
        DomineDSPTests: [test]
        DomineDriver: all
        DomineDriverTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DomineTests
        - DomineDSPTests
        - DomineDriverTests
